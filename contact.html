<!-- Main Content -->
<div id="main">
    <div class="container-btm" id="container">

        <section id="contact_01">

            <div id="sendMail">

                <h2>Contact Me</h2>

                <p>
                    Have questions? Comments?<br>
                    It would be a pleasure to hear from you!
                </p>

                <form action="https://formspree.io/f/mnjwzbyb" method="POST">

                    <!-- Optional Formspree Settings -->
                    <input type="hidden" name="_subject" value="New Portfolio Message">
                    <input type="hidden" name="_captcha" value="false">

                    <div class="elem-group">
                        <label for="name">Name:<br></label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Your name"
                            pattern="[A-Za-zÀ-ÿ\s'-]{2,50}"
                            required>
                    </div>

                    <br>

                    <div class="elem-group">
                        <label for="email">Email:<br></label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="yourname@email.com"
                            required>
                    </div>

                    <br>

                    <div class="elem-group">
                        <label for="message">Message:<br></label>

                        <textarea
                            id="message"
                            name="message"
                            rows="10"
                            placeholder="Leave a message..."
                            required></textarea>
                    </div>

                    <br>

                    <input type="submit" value="SEND MESSAGE">

                </form>

            </div>

        </section>

    </div>
</div>
